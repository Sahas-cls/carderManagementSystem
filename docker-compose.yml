services:
  server:
    build:
      context: ./server
    restart: "no"
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USERNAME: carderuser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-carder_management_sys}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8081:80"
